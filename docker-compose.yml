version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: memed_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - memed_net

  redis:
    image: redis:7-alpine
    container_name: memed_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - memed_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memed_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/memed
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - JWT_EXPIRES_IN=7d
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mongo
      - redis
    networks:
      - memed_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    container_name: memed_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:5000/api
    depends_on:
      - backend
    networks:
      - memed_net

volumes:
  mongo_data:

networks:
  memed_net:
    driver: bridge
